<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Product Enquiry | SSB Poultry</title>    <link rel="stylesheet" href="css/style.css"></head><body>    <header>        <div class="logo-container">            <img src="images/logo.png" alt="SSB Poultry Logo">        </div>        <nav>            <ul>                <li><a href="index.html">Home</a></li>                <li><a href="about.html">About Us</a></li>                <li><a href="products.html">Products</a></li>                <li><a href="enquiry.html" class="active">Enquiry</a></li>                <li><a href="contact.html">Contact</a></li>            </ul>        </nav>    </header>    <main>        <h1>Product Enquiry Form</h1>        <p>Select your items and order preference below. Our team will respond with availability and direct payment details.</p>        <form action="#" method="post" id="enquiryForm">            <fieldset>                <legend>Customer Information</legend>                <label for="fullName">Full Name:</label>                <input type="text" id="fullName" name="fullName" required>                <label for="phone">Phone Number (WhatsApp):</label>                <input type="tel" id="phone" name="phone" required>                <label for="email">Email Address:</label>                <input type="email" id="email" name="email">            </fieldset>            <fieldset>                <legend>Order Details</legend>                <label for="productSelect">Select Product:</label>                <select id="productSelect" name="productSelect" required>                    <option value="">-- Choose a Product --</option>                    <option value="chicks">Day-Old Chicks</option>                    <option value="hens">Point-of-Lay Hens</option>                    <option value="fresh-chicken">Fresh Chicken</option>                    <option value="eggs">Fresh Eggs</option>                    <option value="feed">Feed & Equipment</option>                </select>                <label for="quantity">Quantity Required:</label>                <input type="number" id="quantity" name="quantity" min="1" required>                <label for="fulfillment">Fulfillment Method:</label>                <select id="fulfillment" name="fulfillment" required>                    <option value="collection">Store Collection</option>                    <option value="delivery">Local Delivery (Emalahleni area)</option>                </select>                <label for="notes">Additional Notes or Special Requests:</label>                <textarea id="notes" name="notes" rows="4"></textarea>            </fieldset>            <button type="submit" class="btn-submit">Submit Enquiry</button>        </form>    </main>    <footer>        <p>&copy; 2026 SSB Poultry. All rights reserved.</p>    </footer>    <script src="js/script.js"></script></body></html>
